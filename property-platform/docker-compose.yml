services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-property}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-properties}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-property}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-properties}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  postgres_data:
